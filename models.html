        .model-icon.purple { background: linear-gradient(135deg, var(--accent-2), #c084fc); box-shadow: 0 2px 10px var(--glow-2); }
        .model-icon.amber { background: linear-gradient(135deg, var(--accent-5), #fbbf24); }

<body>
    
    
    

    <div class="main-container">
        <!-- 统计条 -->
        <div class="stats-grid">
            <div class="stat-card">

            </div>
            <div class="stat-card">

            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-model-count">--</div>
                <div class="stat-label">可用模型数</div>
            </div>
        </div>

        <!-- 可用模型 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-list"></i> 可用模型</div>
            </div>
            <div class="card-body">
                <div class="model-list" id="model-list"></div>
            </div>
        </div>

        <!-- Token使用统计 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-coins"></i> Token使用统计</div>
            </div>
            <div class="card-body">
                <div class="token-period-btns">
                    <button class="btn btn-primary btn-sm" data-period="1h" onclick="switchTokenPeriod('1h',this)">1小时</button>
                    <button class="btn btn-ghost btn-sm" data-period="24h" onclick="switchTokenPeriod('24h',this)">1天</button>
                    <button class="btn btn-ghost btn-sm" data-period="7d" onclick="switchTokenPeriod('7d',this)">1周</button>
                    <button class="btn btn-ghost btn-sm" data-period="30d" onclick="switchTokenPeriod('30d',this)">1个月</button>
                    <button class="btn btn-ghost btn-sm" data-period="all" onclick="switchTokenPeriod('all',this)">全部</button>

                    </div>
                    <div class="token-stat-card">
                        <div class="icon" style="color:var(--accent-2)"><i class="fas fa-layer-group"></i></div>

    <script>
        const API_HOST = window.location.origin;
        function formatCallCount(n) {
            return n.toLocaleString('zh-CN') + '次';
        }
        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }
        function jsArg(value) {
            return JSON.stringify(value == null ? '' : String(value))
                .replace(/</g, '\\u003c')
                .replace(/>/g, '\\u003e')
                .replace(/&/g, '\\u0026');
        }
        function safeIconClass(value, fallback) {
            const text = String(value || '');
            return /^[a-z0-9 -]+$/i.test(text) ? text : fallback;
        }
        let modelMap = {}, availableModels = [], agentModels = { codex: null, hermes: null }, tokenData = null, currentTokenPeriod = '1h';

        function normalizeAgentModels(models) {
            const next = models || {};
            return {
                ...next,
                codex: next.codex || null,
                hermes: next.hermes || null
            };
        }

        function getCodexModel(models) {
            const normalized = normalizeAgentModels(models || agentModels);
            return normalized.codex || null;
        }

        async function loadModels() {
            try {
                const r = await fetch(API_HOST + '/api/models');
                const d = await r.json();
                availableModels = d.available_models || [];
                agentModels = normalizeAgentModels(d.agent_models || {});
                modelMap = {};
                availableModels.forEach(m => {
                    const providerName = (m.provider === '龙猫新模型' || m.provider === '龙猫模型' || m.provider === '龙猫') ? '龙猫' : m.provider;
                    const iconMap = {
                        'LongCat-2.0-Preview': { icon: 'indigo', iconClass: 'fa-brain' },
                        'LongCat-Flash-Chat': { icon: 'cyan', iconClass: 'fa-bolt' },
                        'qwen3.5-plus': { icon: 'purple', iconClass: 'fa-cloud' },
                        'gpt-5.4': { icon: 'amber', iconClass: 'fa-star' },
                        'gpt-5.2': { icon: 'indigo', iconClass: 'fa-gem' },
                        'gpt-5.4-mini': { icon: 'amber', iconClass: 'fa-star' },
                    };
                    const style = iconMap[m.id] || { icon: 'indigo', iconClass: 'fa-brain' };
                    const ctx = m.contextWindow >= 1000 ? (m.contextWindow/1000)+'K' : m.contextWindow;
                    modelMap[m.id] = { name: m.name, type: m.reasoning ? '文本对话 | 推理' : '文本对话', provider: providerName, context: ctx, ...style };
                    if (m.provider !== m.id) modelMap[m.provider + '/' + m.id] = modelMap[m.id];
                });
                return d;
            } catch(e) { return null; }
        }
        function getModelInfo(id) {
            if (!id) return { name: '未知模型', type: '--', provider: '--', context: '--', icon: 'indigo', iconClass: 'fa-question' };
            if (modelMap[id]) return modelMap[id];
            for (const [k, v] of Object.entries(modelMap)) { if (id.includes(k) || k.includes(id)) return v; }
            const parts = id.split('/');
            return { name: parts[parts.length-1] || id, type: '文本对话', provider: '未知', context: '--', icon: 'indigo', iconClass: 'fa-brain' };
        }
        function fmtUptime(s) {
            if (!s) return '--';
            const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
            if (d > 0) return `${d}天 ${h}小时`;
            if (h > 0) return `${h}小时 ${m}分钟`;
            return `${m}分钟`;
        }
        function addLog(level, msg) {
            const c = document.getElementById('log-container');
            const t = new Date().toLocaleTimeString('zh-CN');
            const safeLevel = /^(info|success|warning|error)$/i.test(level) ? level.toLowerCase() : 'info';
            c.innerHTML += `<div class="log-entry"><span class="log-time">[${escapeHtml(t)}]</span><span class="log-level ${safeLevel}">${safeLevel.toUpperCase()}</span><span class="log-msg">${escapeHtml(msg)}</span></div>`;
            c.scrollTop = c.scrollHeight;
        }
        async function refreshData() {
            addLog('info', '正在刷新数据...');
            try {
                const [modelsRes, statusRes, callStatsRes] = await Promise.all([
                    fetch(API_HOST + '/api/models').then(r => r.json()),
                    fetch(API_HOST + '/api/status').then(r => r.json()),
                    fetch(API_HOST + '/api/call_stats?period=all').then(r => r.json())
                ]);
                const callStats = callStatsRes || {};
                const realTotalCalls = callStats.total_calls || 0;

                if (modelsRes) {
                    availableModels = modelsRes.available_models || [];
                    agentModels = normalizeAgentModels(modelsRes.agent_models || {});
                    modelMap = {};
                    availableModels.forEach(m => {
                        const providerName = (m.provider === '龙猫新模型' || m.provider === '龙猫模型' || m.provider === '龙猫') ? '龙猫' : m.provider;
                        const iconMap = {
                            'LongCat-2.0-Preview': { icon: 'indigo', iconClass: 'fa-brain' },
                            'LongCat-Flash-Chat': { icon: 'cyan', iconClass: 'fa-bolt' },
                            'qwen3.5-plus': { icon: 'purple', iconClass: 'fa-cloud' },
                            'gpt-5.4': { icon: 'amber', iconClass: 'fa-star' },
                            'gpt-5.2': { icon: 'indigo', iconClass: 'fa-gem' },
                            'gpt-5.4-mini': { icon: 'amber', iconClass: 'fa-star' },
                        };
                        const style = iconMap[m.id] || { icon: 'indigo', iconClass: 'fa-brain' };
                        const ctx = m.contextWindow >= 1000 ? (m.contextWindow/1000)+'K' : m.contextWindow;
                        modelMap[m.id] = { name: m.name, type: m.reasoning ? '文本对话 | 推理' : '文本对话', provider: providerName, context: ctx, ...style };
                        modelMap[m.provider + '/' + m.id] = modelMap[m.id];
                    });
                }
                const d = statusRes, agents = d.agents || {}, ms = d.model_stats || {};
                const codex = agents.codex || {}, he = agents.hermes || {};
                // 使用 api_monitor 的真实调用次数和响应时间
                const totalCalls = realTotalCalls;
                // 从 call_stats 获取各智能体的真实调用次数
                const codexBySource = (callStats.by_source || {}).codex || {};
                const heBySource = (callStats.by_source || {}).hermes || {};
                const codexCalls = codexBySource.calls || 0;
                const heCalls = heBySource.calls || 0;
                // 真实运行状态
                const codexOnline = codex.running || false;
                const heOnline = he.running || false;
                const codexUptime = codex.uptime_seconds || 0;
                const heUptime = he.uptime_seconds || 0;
                // 更新统计条
                document.getElementById('stat-total-calls').textContent = formatCallCount(totalCalls);
                document.getElementById('stat-codex-uptime').textContent = fmtUptime(codexUptime);
                document.getElementById('stat-he-uptime').textContent = fmtUptime(heUptime);
                document.getElementById('stat-model-count').textContent = (availableModels || []).length + '个';
                updateAgentCards(codexCalls, heCalls, codexOnline, heOnline, codexUptime, heUptime);
                updateModelList(ms.model_id || getCodexModel(agentModels) || 'LongCat-2.0-Preview');
                addLog('success', `刷新成功 | 调用${formatCallCount(totalCalls)}`);
            } catch(e) { addLog('error', '刷新失败: ' + e.message); }
        }
        function updateAgentCards(codexCalls, heCalls, codexOnline, heOnline, codexUptime, heUptime) {
            const codexModel = getCodexModel(agentModels) || 'LongCat-2.0-Preview';
            const heModel = agentModels.hermes || codexModel;
            const codexInfo = getModelInfo(codexModel), heInfo = getModelInfo(heModel);
            const codexSwitchBtns = availableModels.map(m => {
                const isCurrent = codexModel.includes(m.id) || m.id.includes(codexModel.split('/').pop());
                if (isCurrent) return `<button class="btn btn-primary btn-sm" disabled><i class="fas fa-check"></i> 当前</button>`;
                return `<button class="btn btn-success btn-sm" onclick='NexusAuth.requireAuth(function(){switchAgentModel("codex", ${jsArg(m.id)})})'><i class="fas fa-exchange-alt"></i> ${escapeHtml(m.name)}</button>`;
            }).join(' ');
            const heSwitchBtns = availableModels.map(m => {
                const isCurrent = heModel.includes(m.id) || m.id.includes(heModel.split('/').pop());
                if (isCurrent) return `<button class="btn btn-primary btn-sm" disabled><i class="fas fa-check"></i> 当前</button>`;
                return `<button class="btn btn-success btn-sm" onclick='NexusAuth.requireAuth(function(){switchAgentModel("hermes", ${jsArg(m.id)})})'><i class="fas fa-exchange-alt"></i> ${escapeHtml(m.name)}</button>`;
            }).join(' ');
            const codexStatusText = codexOnline ? '运行中' : '已停止';
            const heStatusText = heOnline ? '运行中' : '已停止';
            const codexStatusColor = codexOnline ? 'var(--accent-3)' : 'var(--accent-1)';
            const heStatusColor = heOnline ? 'var(--accent-3)' : 'var(--accent-1)';
            document.getElementById('agents-grid').innerHTML = `
                <div class="agent-card">
                    <div class="agent-header">
                        <div class="agent-avatar red">C</div>
                        <div>
                            <div class="agent-name">Codex</div>
                            <div class="agent-role">主智能体 · <span style="color:${codexStatusColor}">${codexStatusText}</span> · ${escapeHtml(fmtUptime(codexUptime))}</div>
                        </div>
                    </div>
                    <div class="agent-stats">
                        <div class="agent-stat"><div class="agent-stat-val">${escapeHtml(formatCallCount(codexCalls))}</div><div class="agent-stat-label">调用次数</div></div>
                        <div class="agent-stat"><div class="agent-stat-val" style="color:${codexStatusColor}">${codexStatusText}</div><div class="agent-stat-label">运行状态</div></div>
                    </div>
                    <div class="agent-model-section">
                        <div class="agent-model-label"><i class="fas fa-microchip"></i>当前模型：<span class="agent-model-name">${escapeHtml(codexInfo.name)}</span></div>
                        <div class="agent-model-detail">${escapeHtml(codexInfo.provider)} · 上下文 ${escapeHtml(codexInfo.context)}</div>
                        <div class="agent-switch-btns">${codexSwitchBtns}</div>
                    </div>
                </div>
                <div class="agent-card">
                    <div class="agent-header">
                        <div class="agent-avatar blue">H</div>
                        <div>
                            <div class="agent-name">Hermes</div>
                            <div class="agent-role">辅助智能体 · <span style="color:${heStatusColor}">${heStatusText}</span> · ${escapeHtml(fmtUptime(heUptime))}</div>
                        </div>
                    </div>
                    <div class="agent-stats">
                        <div class="agent-stat"><div class="agent-stat-val">${escapeHtml(formatCallCount(heCalls))}</div><div class="agent-stat-label">调用次数</div></div>
                        <div class="agent-stat"><div class="agent-stat-val" style="color:${heStatusColor}">${heStatusText}</div><div class="agent-stat-label">运行状态</div></div>
                    </div>
                    <div class="agent-model-section">
                        <div class="agent-model-label"><i class="fas fa-microchip"></i>当前模型：<span class="agent-model-name">${escapeHtml(heInfo.name)}</span></div>
                        <div class="agent-model-detail">${escapeHtml(heInfo.provider)} · 上下文 ${escapeHtml(heInfo.context)}</div>
                        <div class="agent-switch-btns">${heSwitchBtns}</div>
                    </div>
                </div>`;
        }
        function updateModelList(currentModelId) {
            const groups = {};
            availableModels.forEach(m => {
                const mi = getModelInfo(m.id);
                if (!groups[mi.provider]) groups[mi.provider] = [];
                groups[mi.provider].push({ ...m, info: mi });
            });
            let listHTML = '';
            Object.entries(groups).forEach(([provider, models]) => {
                listHTML += `<div class="model-provider-title"><i class="fas fa-server"></i>${escapeHtml(provider)}</div>`;
                models.forEach(m => {
                    const mi = m.info;
                    const isActive = currentModelId.includes(m.id) || m.id.includes(currentModelId.split('/').pop());
                    const iconClass = safeIconClass(mi.iconClass, 'fa-brain');
                    const iconColor = safeIconClass(mi.icon, 'indigo');
                    listHTML += `
                    <div class="model-item ${isActive ? 'active' : ''}">
                        <div class="model-info">
                            <div class="model-icon ${iconColor}"><i class="fas ${iconClass}"></i></div>
                            <div>
                                <div class="model-name">${escapeHtml(mi.name)}${isActive ? '<span class="model-badge current">使用中</span>' : '<span class="model-badge available">可用</span>'}</div>
                                <div class="model-meta">${escapeHtml(mi.type)} · 上下文 ${escapeHtml(mi.context)}</div>
                            </div>
                        </div>
                        <div class="model-specs">
                            <span><i class="fas fa-brain" style="margin-right:3px;"></i>${mi.type.includes('推理') ? '推理' : '标准'}</span>
                            <span><i class="fas fa-memory" style="margin-right:3px;"></i>${escapeHtml(mi.context)}</span>
                        </div>
                    </div>`;
                });
            });
            document.getElementById('model-list').innerHTML = listHTML;
        }
        function formatTokenNum(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }
        function switchTokenPeriod(period, btn) {
            currentTokenPeriod = period;
            document.querySelectorAll('.token-period-btns .btn').forEach(b => { b.classList.remove('btn-primary'); b.classList.add('btn-ghost'); });
            btn.classList.remove('btn-ghost'); btn.classList.add('btn-primary');
            fetchTokenStats();
        }
        function renderTokenStats() {
            if (!tokenData) return;
            // 新 API 直接返回当前 period 的数据（不需要再取 sub-key）
            const d = tokenData;
            const input = d.total_input || d.input || 0;
            const output = d.total_output || d.output || 0;
            const total = d.total_tokens || d.total || 0;
            document.getElementById('token-input').textContent = formatTokenNum(input);
            document.getElementById('token-output').textContent = formatTokenNum(output);
            document.getElementById('token-total').textContent = formatTokenNum(total);

            // 按来源分布
            const bySource = tokenData.by_source || tokenData.bySource || {};
            const codexData = bySource.codex || {};
            const heData = bySource.hermes || {};
            const codexTotal = (codexData.total || codexData.tokens || (codexData.input + codexData.output) || 0);
            const heTotal = (heData.total || heData.tokens || (heData.input + heData.output) || 0);
            const grandTotal = codexTotal + heTotal;
            const codexPct = grandTotal > 0 ? Math.round(codexTotal / grandTotal * 100) : 0;
            const hePct = grandTotal > 0 ? Math.round(heTotal / grandTotal * 100) : 0;

            const codexBar = document.getElementById('token-source-codex-bar');
            const heBar = document.getElementById('token-source-he-bar');
            if (codexBar) { codexBar.style.width = codexPct + '%'; codexBar.style.background = 'linear-gradient(90deg, var(--accent-1), var(--accent-2))'; }
            if (heBar) { heBar.style.width = hePct + '%'; heBar.style.background = 'linear-gradient(90deg, var(--accent-3), var(--accent-4))'; }
            const codexVal = document.getElementById('token-source-codex-value');
            const heVal = document.getElementById('token-source-he-value');
            if (codexVal) codexVal.textContent = formatTokenNum(codexTotal) + ' (' + codexPct + '%)';
            if (heVal) heVal.textContent = formatTokenNum(heTotal) + ' (' + hePct + '%)';

            // 按模型分布
            const byModel = tokenData.by_model || tokenData.byModel || {};
            const container = document.getElementById('token-by-model');
            const models = Object.entries(byModel);
            if (models.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:16px;">暂无数据</div>'; return; }
            const maxTotal = Math.max(...models.map(m => m[1].total || (m[1].input + m[1].output) || 0));
            let html = '';
            models.forEach(([model, stats]) => {
                const barPct = maxTotal > 0 ? Math.round(stats.total / maxTotal * 100) : 0;
                const inputPct = stats.total > 0 ? Math.round(stats.input / stats.total * 100) : 0;
                const outputPct = Math.max(0, Math.min(100, 100 - inputPct));
                html += `
                <div class="token-model-row">
                    <div class="token-model-name" title="${escapeHtml(model)}">${escapeHtml(model)}</div>
                    <div class="token-model-bar">
                        <div class="token-model-bar-in" style="width:${inputPct}%" title="输入 ${formatTokenNum(stats.input)}">${inputPct > 15 ? formatTokenNum(stats.input) : ''}</div>
                        <div class="token-model-bar-out" style="width:${outputPct}%" title="输出 ${formatTokenNum(stats.output)}">${outputPct > 15 ? formatTokenNum(stats.output) : ''}</div>
                    </div>
                    <div class="token-model-total">${formatTokenNum(stats.total)}</div>
                </div>`;
            });
            html += `<div class="token-legend"><div class="token-legend-item"><div class="token-legend-color" style="background:linear-gradient(135deg,var(--accent-1),var(--accent-2))"></div>输入Token</div><div class="token-legend-item"><div class="token-legend-color" style="background:linear-gradient(135deg,var(--accent-3),var(--accent-4))"></div>输出Token</div></div>`;
            container.innerHTML = html;
        }
        function fetchTokenStats() {
            const period = currentTokenPeriod || 'all';
            fetch(API_HOST + '/api/call_stats?period=' + encodeURIComponent(period)).then(r => r.json()).then(d => { tokenData = d; renderTokenStats(); }).catch(() => {});
        }
        async function switchAgentModel(agent, modelId) {
            addLog('info', `正在切换 ${agent} 模型到 ${modelId}...`);
            const aliases = [agent];
            let lastError = '未知错误';
            for (const alias of aliases) {
                try {
                    const response = await fetch(API_HOST + '/api/switch_model?agent=' + encodeURIComponent(alias) + '&model_id=' + encodeURIComponent(modelId));
                    const result = await response.json();
                    if (result.status === 'success') {
                        addLog('success', `✅ ${result.message}`);
                        setTimeout(refreshData, 1000);
                        return;
                    }
                    lastError = result.error || result.message || `HTTP ${response.status}`;
                } catch (err) {
                    lastError = err.message;
                }
            }
            addLog('error', `❌ 切换失败: ${lastError}`);
            setTimeout(refreshData, 1000);
        }
        function switchModel(id) { addLog('info', '切换模型: ' + id); }
        function restartModel() { if (confirm('确定重启模型？')) { addLog('warning', '模型重启中...'); setTimeout(() => addLog('success', '模型重启完成'), 2000); } }
        function clearCache() { if (confirm('确定清理缓存？')) { addLog('info', '清理缓存...'); setTimeout(() => addLog('success', '缓存已清理'), 800); } }
        function clearLogs() { document.getElementById('log-container').innerHTML = ''; addLog('info', '日志已清空'); }
        function exportLogs() {
            const logs = document.getElementById('log-container').innerText;
            const blob = new Blob([logs], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'nexus-logs-' + new Date().toISOString().slice(0,10) + '.txt'; a.click();
            URL.revokeObjectURL(url); addLog('success', '日志已导出');
        }
        // SSE 实时推送状态数据
        function connectModelsSSE() {
            const evtSource = new EventSource(API_HOST + '/api/events');
            evtSource.onmessage = function(e) {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.data && msg.data.agents) {
                        updateFromSSE(msg.data);
                    }
                } catch(err) { console.error('SSE parse error:', err); }
            };
            evtSource.onerror = function() {
                console.warn('SSE 连接断开，3秒后重试...');
                evtSource.close();
                setTimeout(connectModelsSSE, 3000);
            };
        }
        // SSE 实时更新：更新 models.html 中所有动态数据
        function updateFromSSE(data) {
            const codex = (data.agents || {}).codex || {};
            const he = (data.agents || {}).hermes || {};
            const ms = data.model_stats || {};
            // 统计条 - 总调用次数
            if (ms.total_calls !== undefined) {
                const el = document.getElementById('stat-total-calls');
                if (el) el.textContent = (ms.total_calls || 0).toLocaleString('zh-CN') + '次';
            }
            // 统计条 - Codex 运行时长
            if (codex.uptime_seconds !== undefined) {
                const el = document.getElementById('stat-codex-uptime');
                if (el) el.textContent = fmtUptime(codex.uptime_seconds);
            }
            // 统计条 - Hermes 运行时长
            if (he.uptime_seconds !== undefined) {
                const el = document.getElementById('stat-he-uptime');
                if (el) el.textContent = fmtUptime(he.uptime_seconds);
            }
            // 更新模型列表中的"使用中"标记
            if (ms.model_id) {
                updateModelList(ms.model_id);
            }
            // 更新可用模型数
            if (ms.model_count !== undefined) {
                const el = document.getElementById('stat-model-count');
                if (el) el.textContent = ms.model_count + '个';
            }

            // 调用次数变化时记录日志
            if (ms.total_calls !== undefined && ms.total_calls !== window._lastLoggedCalls) {
                window._lastLoggedCalls = ms.total_calls;
                addLog('info', `实时更新 | 调用${(ms.total_calls || 0).toLocaleString('zh-CN')}次`);
            }
        }

        loadModels().then(() => { refreshData(); connectModelsSSE(); });
        fetchTokenStats();
        setInterval(fetchTokenStats, 30000);
        // 每2分钟自动刷新一次数据和日志
        setInterval(function() { refreshData(); }, 120000);

    </script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var refreshBtn = document.querySelector('button[onclick="refreshData()"]');
        if (refreshBtn) refreshBtn.onclick = function() { NexusAuth.requireAuth(function() { refreshData(); }); };
        var restartBtn = document.querySelector('button[onclick="restartModel()"]');
        if (restartBtn) restartBtn.onclick = function() { NexusAuth.requireAuth(function() { restartModel(); }); };
        var cacheBtn = document.querySelector('button[onclick="clearCache()"]');
        if (cacheBtn) cacheBtn.onclick = function() { NexusAuth.requireAuth(function() { clearCache(); }); };
        var clearLogBtn = document.querySelector('button[onclick="clearLogs()"]');
        if (clearLogBtn) clearLogBtn.onclick = function() { NexusAuth.requireAuth(function() { clearLogs(); }); };
        var exportBtn = document.querySelector('button[onclick="exportLogs()"]');
        if (exportBtn) exportBtn.onclick = function() { NexusAuth.requireAuth(function() { exportLogs(); }); };
        document.addEventListener('click', function(e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            var onclickAttr = btn.getAttribute('onclick') || '';
            if (onclickAttr.includes('switchModel') || onclickAttr.includes('switchAgentModel')) {
                if (btn.disabled || btn.classList.contains('btn-primary')) return;
                e.preventDefault(); e.stopPropagation();
                var match = onclickAttr.match(/switch(?:Agent)?Model\('([^']+)'(?:,\s*'([^']+)')?\)/);
                if (match) {
                    if (match[2]) NexusAuth.requireAuth(function() { switchAgentModel(match[1], match[2]); });
                    else NexusAuth.requireAuth(function() { switchModel(match[1]); });
                }
            }
        });
        document.querySelectorAll('.token-period-btns .btn').forEach(function(btn) {
            var period = btn.getAttribute('data-period');
            if (period) btn.onclick = function() { switchTokenPeriod(period, btn); };
        });
    });
</script>
