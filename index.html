<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>仪表盘 · 小猪智能体面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
    <style>
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 14px;
        }

        [data-theme="light"] .info-card {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.05);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        [data-theme="light"] .info-row {
            border-bottom-color: rgba(0, 0, 0, 0.05);
        }

        .info-key {
            color: var(--text-muted);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .info-val {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            word-break: break-all;
        }

        .info-val.highlight {
            color: var(--accent-1);
        }

        .stat-detail {
            margin-top: 3px;
            color: var(--text-muted);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .info-card {
                padding: 10px;
            }

            .info-key,
            .info-val {
                font-size: 13px;
            }

            .stat-detail {
                font-size: 11px;
            }
        }
    </style>
    <link rel="stylesheet" href="theme.css?v=20260429">
    <link rel="stylesheet" href="navbar.css?v=20260429">
</head>
<body>
    
    

    <div class="main-container">
        <!-- 统计条 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-cpu">--%</div>
                <div class="stat-label">CPU使用率</div>
                <div class="stat-detail" id="stat-cpu-detail">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-memory">--%</div>
                <div class="stat-label">内存使用率</div>
                <div class="stat-detail" id="stat-mem-detail">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-disk">--%</div>
                <div class="stat-label">磁盘使用率</div>
                <div class="stat-detail" id="stat-disk-detail">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-uptime">--</div>
                <div class="stat-label">服务器运行时间</div>
                <div class="stat-detail" id="stat-load">负载: --</div>
            </div>
        </div>

        <!-- 面板信息卡片 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-info-circle"></i> 面板信息</div>
            </div>
            <div class="card-body">
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-row"><span class="info-key"><i class="fas fa-code-branch"></i> 当前版本</span><span class="info-val highlight" id="panel-version">--</span></div>
                        <div class="info-row"><span class="info-key"><i class="fas fa-folder"></i> 面板大小</span><span class="info-val" id="panel-dir-size">--</span></div>
                        <div class="info-row"><span class="info-key"><i class="fas fa-memory"></i> 面板内存</span><span class="info-val" id="panel-mem">--</span></div>
                    </div>
                    <div class="info-card">
                        <div class="info-row"><span class="info-key"><i class="fas fa-hdd"></i> 磁盘使用率</span><span class="info-val" id="panel-disk">--</span></div>
                        <div class="info-row"><span class="info-key"><i class="fas fa-clock"></i> 最后更新</span><span class="info-val" id="panel-update-date">--</span></div>
                        <div class="info-row"><span class="info-key"><i class="fas fa-network-wired"></i> 网络流量</span><span class="info-val" id="panel-network">--</span></div>
                    </div>
                </div>
            </div>
        </div>

                <div id="agent-cards-container"></div>
    </div>

    <script>
        const API_HOST = window.location.origin;
        const API_URL = API_HOST + '/api/status';
        
        function formatUptime(seconds) {
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return d + '天' + h + '小时' + m + '分';
            else if (h > 0) return h + '小时' + m + '分';
            if (m > 0) return m + '分';
            return Math.max(0, Math.floor(seconds || 0)) + '秒';
        }
        
        function formatBytes(bytes) {
            if (bytes < 1024) return Math.round(bytes) + 'B';
            else if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
            else return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        }

        function toNumber(value) {
            const n = Number(value);
            return Number.isFinite(n) ? n : null;
        }

        function formatPercent(value) {
            const n = toNumber(value);
            return n === null ? '--' : n + '%';
        }

        function formatGbPair(used, total) {
            const usedN = toNumber(used);
            const totalN = toNumber(total);
            if (usedN === null || totalN === null) return '--';
            return usedN + 'GB / ' + totalN + 'GB';
        }

        function formatMb(value) {
            const n = toNumber(value);
            return n === null ? '--' : n + 'MB';
        }

        function statusText(status) {
            if (status === 'online') return '运行中';
            if (status === 'stopped') return '已停止';
            if (status === 'offline') return '离线';
            return '--';
        }
        
        function formatNetworkSpeed(bytesPerSecond) {
            const value = toNumber(bytesPerSecond);
            if (value === null) return '--';
            if (value < 1024) return Math.round(value) + 'B/s';
            if (value < 1024 * 1024) return (value / 1024).toFixed(1) + 'KB/s';
            return (value / (1024 * 1024)).toFixed(1) + 'MB/s';
        }
        
        function setStatusColor(el, status) {
            if (status === 'online') {
                el.style.color = 'var(--accent-4)';
            } else if (status === 'stopped' || status === 'offline') {
                el.style.color = 'var(--accent-6)';
            } else {
                el.style.color = 'var(--text-secondary)';
            }
        }
        
        // 智能体 ID → 图标映射（动态）
        function agentIcon(agentId) {
            const icons = { 'openclaw': 'fa-robot', 'codex': 'fa-code' };
            return icons[agentId] || 'fa-microchip';
        }

        // 动态生成智能体卡片
        function renderAgentCards(agents) {
            const container = document.getElementById('agent-cards-container');
            if (!container) return;
            if (container.children.length === 0) {
                let html = '';
                for (const [agentId, info] of Object.entries(agents || {})) {
                    const label = info.name || agentId;
                    const icon = agentIcon(agentId);
                    html += `
        <div class="card agent-card" data-agent="${agentId}">
            <div class="card-header">
                <div class="card-title"><i class="fas ${icon}"></i> ${label} 智能体</div>
            </div>
            <div class="card-body">
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-row"><span class="info-key">运行状态</span><span class="info-val" id="${agentId}-status">--</span></div>
                        <div class="info-row"><span class="info-key">CPU使用率</span><span class="info-val" id="${agentId}-cpu">--</span></div>
                        <div class="info-row"><span class="info-key">内存使用率</span><span class="info-val" id="${agentId}-memory">--</span></div>
                        <div class="info-row"><span class="info-key">内存占用</span><span class="info-val" id="${agentId}-mem-mb">--</span></div>
                    </div>
                    <div class="info-card">
                        <div class="info-row"><span class="info-key">网络入站</span><span class="info-val" id="${agentId}-net-in">--</span></div>
                        <div class="info-row"><span class="info-key">网络出站</span><span class="info-val" id="${agentId}-net-out">--</span></div>
                        <div class="info-row"><span class="info-key">当前模型</span><span class="info-val highlight" id="${agentId}-model">--</span></div>
                        <div class="info-row"><span class="info-key">API调用</span><span class="info-val" id="${agentId}-calls">--</span></div>
                    </div>
                </div>
            </div>
        </div>`;
                }
                container.innerHTML = html;
            }
        }
        
        function updateDashboard(data) {
                    const sys = data.system_info || {};
                    const agents = data.agents || {};
                    const ms = data.model_stats || {};
                    
                    // 统计条
                    document.getElementById('stat-cpu').textContent = formatPercent(sys.total_cpu);
                    document.getElementById('stat-cpu-detail').textContent = '负载: ' + (sys.load_avg || '--');
                    document.getElementById('stat-memory').textContent = formatPercent(sys.total_memory);
                    document.getElementById('stat-mem-detail').textContent = formatGbPair(sys.mem_used_gb, sys.mem_total_gb);
                    document.getElementById('stat-disk').textContent = formatPercent(sys.total_disk);
                    document.getElementById('stat-disk-detail').textContent = formatGbPair(sys.disk_used_gb, sys.disk_total_gb);
                    document.getElementById('stat-uptime').textContent = formatUptime(sys.server_uptime_seconds || 0);
                    document.getElementById('stat-load').textContent = '负载: ' + (sys.load_avg || '--');

                    // 动态生成卡片（首次）并更新所有智能体数据
                    renderAgentCards(agents);
                    for (const [agentId, info] of Object.entries(agents)) {
                        const setStatus = (field, value) => {
                            const el = document.getElementById(agentId + '-' + field);
                            if (el) el.textContent = value;
                        };
                        const status = info.status || 'unknown';
                        const statusEl = document.getElementById(agentId + '-status');
                        if (statusEl) {
                            statusEl.textContent = statusText(status);
                            setStatusColor(statusEl, status);
                        }
                        setStatus('cpu', formatPercent(info.cpu_usage));
                        setStatus('memory', formatPercent(info.memory_usage));
                        setStatus('mem-mb', formatMb(info.mem_mb));
                        setStatus('net-in', formatNetworkSpeed(info.network_in || 0));
                        setStatus('net-out', formatNetworkSpeed(info.network_out || 0));
                        setStatus('model', ms.model_id || info.model || '--');
                        setStatus('calls', info.api_calls || 0);
                    }
                    
                    // 面板信息
                    const pi = data.panel_info || {};
                    document.getElementById('panel-version').textContent = pi.panel_version || '--';
                    document.getElementById('panel-dir-size').textContent = pi.dir_size || '--';
                    document.getElementById('panel-mem').textContent = pi.panel_mem || '--';
                    document.getElementById('panel-update-date').textContent = pi.update_date || '--';
                    document.getElementById('panel-disk').textContent = formatPercent(sys.total_disk);
                    document.getElementById('panel-network').textContent = '↓' + formatNetworkSpeed(sys.total_network_in || 0) + ' ↑' + formatNetworkSpeed(sys.total_network_out || 0);
                }

        // SSE 实时推送（主数据源）+ 轮询 fallback
        let sseConnected = false;
        function connectSSE() {
            const evtSource = new EventSource(API_HOST + '/api/events');
            evtSource.onopen = function() {
                sseConnected = true;
                console.log('✅ SSE 实时连接已建立');
            };
            evtSource.onmessage = function(e) {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.data) {
                        updateDashboard(msg.data);
                        // 如果有变化字段，高亮显示
                        if (msg.changes && msg.changes.length > 0) {
                            highlightChanges(msg.changes);
                        }
                    }
                } catch(err) { console.error('SSE parse error:', err); }
            };
            evtSource.onerror = function() {
                sseConnected = false;
                console.warn('⚠️ SSE 连接断开，3秒后重试...');
                evtSource.close();
                setTimeout(connectSSE, 3000);
            };
        }
        function highlightChanges(changes) {
            // 高亮显示变化的字段
            changes.forEach(c => {
                const parts = c.split('.');
                if (parts.length < 2) return;
                const agent = parts[0];
                const field = parts[1];
                // 找到对应的 DOM 元素并添加高亮动画
                const idMap = {
                    'oc': { 'cpu_usage': 'codex-cpu', 'memory_usage': 'codex-memory', 'status': 'codex-status', 'model': 'codex-model', 'api_calls': 'codex-calls' },
                    'codex': { 'cpu_usage': 'codex-cpu', 'memory_usage': 'codex-memory', 'status': 'codex-status', 'model': 'codex-model', 'api_calls': 'codex-calls' },
                };
                const elId = idMap[agent] && idMap[agent][field];
                if (elId) {
                    const el = document.getElementById(elId);
                    if (el) {
                        el.style.transition = 'color 0.3s';
                        el.style.color = 'var(--accent-3)';
                        setTimeout(() => { el.style.color = ''; }, 1000);
                    }
                }
            });
        }
        // 首屏先拉一次，避免等待 SSE 首帧
        fetch(API_URL).then(r => r.json()).then(d => updateDashboard(d)).catch(() => {});
        // 启动 SSE 实时连接
        connectSSE();
        // 轮询 fallback：每 30 秒从 /api/status 拉取一次（防止 SSE 静默断开）
        setInterval(() => {
            if (!sseConnected) {
                fetch(API_URL).then(r => r.json()).then(d => updateDashboard(d)).catch(() => {});
            }
        }, 30000);
</script>
<script src="auth.js?v=20260429"></script>
<script src="navbar.js?v=20260429"></script>
</body>
</html>
