<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>文件管理 · 小猪智能体面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css?v=20260429">
    <link rel="stylesheet" href="navbar.css?v=20260429">
    <style>
        .file-breadcrumb { display: flex; align-items: center; gap: 6px; padding: 12px 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .file-breadcrumb a { color: var(--accent-1); text-decoration: none; font-size: 14px; padding: 2px 6px; border-radius: 4px; transition: background 0.2s; }
        .file-breadcrumb a:hover { background: rgba(99,102,241,0.1); }
        .file-breadcrumb span { color: var(--text-muted); font-size: 14px; }
        .file-breadcrumb .sep { color: var(--text-muted); opacity: 0.5; }
        .file-toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .file-list { display: flex; flex-direction: column; gap: 2px; }
        .file-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; background: rgba(255,255,255,0.01); border: 1px solid transparent; transition: all 0.2s; cursor: pointer; }
        .file-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); }
        .file-item .icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .file-item .icon.dir { background: rgba(99,102,241,0.1); color: var(--accent-1); }
        .file-item .icon.file { background: rgba(255,255,255,0.04); color: var(--text-muted); }
        .file-item .name { flex: 1; font-size: 14px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item .meta { display: flex; gap: 16px; color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
        .file-item .meta span { min-width: 80px; text-align: right; }
        .file-item .actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
        .file-item:hover .actions { opacity: 1; }
        .file-item .actions button { padding: 4px 8px; font-size: 12px; }
        .file-editor { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
        .file-editor-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.04); }
        .file-editor-header .path { font-size: 13px; color: var(--text-muted); font-family: monospace; }
        .file-editor textarea { width: 100%; min-height: 400px; background: transparent; border: none; padding: 16px; color: var(--text-primary); font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 13px; line-height: 1.6; resize: vertical; outline: none; }
        .upload-zone { border: 2px dashed rgba(255,255,255,0.08); border-radius: 10px; padding: 32px; text-align: center; color: var(--text-muted); transition: all 0.2s; cursor: pointer; margin-bottom: 16px; }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent-1); background: rgba(99,102,241,0.05); color: var(--accent-1); }
        .upload-zone input[type="file"] { display: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .modal-box { background: var(--bg-card, #1a1a2e); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; min-width: 400px; max-width: 90vw; }
        .modal-box h3 { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .modal-box .form-group { margin-bottom: 12px; }
        .modal-box label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .modal-box input { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: var(--text-primary); font-size: 14px; }
        .modal-box input:focus { outline: none; border-color: var(--accent-1); }
        .modal-box .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        .toast-container { position: fixed; top: 16px; right: 16px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; animation: toastIn 0.3s ease; }
        .toast.success { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }
        .toast.error { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .toast.info { background: rgba(99,102,241,0.15); color: var(--accent-1); border: 1px solid rgba(99,102,241,0.2); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .file-item .meta { display: none; }
            .file-item .actions { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="navbar-container"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="main-container">
    <div class="file-breadcrumb" id="breadcrumb">
        <a href="#" onclick="navigateTo('/')"><i class="fas fa-home"></i> /</a>
    </div>

    <div class="file-toolbar">
        <button class="btn btn-primary btn-sm" onclick="showNewFileModal()"><i class="fas fa-plus"></i> 新建文件</button>
        <button class="btn btn-primary btn-sm" onclick="showNewDirModal()"><i class="fas fa-folder-plus"></i> 新建目录</button>
        <div class="upload-zone" id="uploadZone" style="margin:0;padding:8px 16px;flex:1;max-width:300px;" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt"></i> 拖拽或点击上传文件
            <input type="file" id="fileInput" multiple onchange="handleUpload(this.files)">
        </div>
        <button class="btn btn-ghost btn-sm" onclick="refreshFiles()"><i class="fas fa-sync-alt"></i> 刷新</button>
    </div>

    <div class="file-list" id="fileList">
        <div style="color:var(--text-muted);text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
    </div>
</div>

<script>
const API_HOST = window.location.origin;
let currentPath = '/';

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast ' + (type || 'info');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function navigateTo(path) {
    currentPath = path;
    updateBreadcrumb(path);
    loadFiles(path);
}

function updateBreadcrumb(path) {
    const bc = document.getElementById('breadcrumb');
    const parts = path.split('/').filter(Boolean);
    let html = '<a href="#" onclick="navigateTo(\'/\')"><i class="fas fa-home"></i> /</a>';
    let accum = '';
    parts.forEach((p, i) => {
        accum += (accum ? '/' : '') + p;
        html += '<span class="sep">/</span>';
        if (i === parts.length - 1) {
            html += '<span>' + escapeHtml(p) + '</span>';
        } else {
            html += '<a href="#" onclick="navigateTo(' + escapeHtml(JSON.stringify(accum)) + ')">' + escapeHtml(p) + '</a>';
        }
    });
    bc.innerHTML = html;
}

async function loadFiles(path) {
    const container = document.getElementById('fileList');
    container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>';
    try {
        const resp = await fetch(API_HOST + '/api/files?path=' + encodeURIComponent(path));
        const data = await resp.json();
        if (!data.success) {
            container.innerHTML = '<div style="color:var(--accent-6);text-align:center;padding:40px;"><i class="fas fa-exclamation-circle"></i> ' + escapeHtml(data.error || '加载失败') + '</div>';
            return;
        }
        const items = data.items || [];
        // 排序：目录在前，文件在后
        items.sort((a, b) => {
            if (a.is_dir && !b.is_dir) return -1;
            if (!a.is_dir && b.is_dir) return 1;
            return a.name.localeCompare(b.name);
        });
        if (items.length === 0 && path !== '/') {
            container.innerHTML = '<div class="file-item" onclick="navigateTo(\'' + escapeHtml(path.split('/').slice(0,-1).join('/') || '/') + '\')"><div class="icon dir"><i class="fas fa-level-up-alt"></i></div><div class="name">..</div></div><div style="color:var(--text-muted);text-align:center;padding:20px;font-size:13px;">空目录</div>';
            return;
        }
        let html = '';
        if (path !== '/') {
            const parent = path.split('/').slice(0, -1).join('/') || '/';
            html += '<div class="file-item" onclick="navigateTo(\'' + escapeHtml(parent) + '\')"><div class="icon dir"><i class="fas fa-level-up-alt"></i></div><div class="name">..</div><div class="meta"></div></div>';
        }
        items.forEach(item => {
            const iconClass = item.is_dir ? 'dir' : 'file';
            const iconName = item.is_dir ? 'fa-folder' : getFileIcon(item.name);
            html += '<div class="file-item" onclick="' + (item.is_dir ? 'navigateTo(' + escapeHtml(JSON.stringify(item.path)) + ')' : 'editFile(' + escapeHtml(JSON.stringify(item.path)) + ')') + '">';
            html += '<div class="icon ' + iconClass + '"><i class="fas ' + iconName + '"></i></div>';
            html += '<div class="name" title="' + escapeHtml(item.name) + '">' + escapeHtml(item.name) + '</div>';
            html += '<div class="meta"><span>' + escapeHtml(item.size_human || '') + '</span><span>' + escapeHtml(item.modified || '') + '</span></div>';
            if (!item.is_dir) {
                html += '<div class="actions">';
                html += '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();downloadFile(' + escapeHtml(JSON.stringify(item.path)) + ')"><i class="fas fa-download"></i></button>';
                html += '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteItem(' + escapeHtml(JSON.stringify(item.path)) + ',\'file\')"><i class="fas fa-trash"></i></button>';
                html += '</div>';
            } else {
                html += '<div class="actions">';
                html += '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteItem(' + escapeHtml(JSON.stringify(item.path)) + ',\'dir\')"><i class="fas fa-trash"></i></button>';
                html += '</div>';
            }
            html += '</div>';
        });
        container.innerHTML = html;
    } catch(e) {
        container.innerHTML = '<div style="color:var(--accent-6);text-align:center;padding:40px;"><i class="fas fa-exclamation-circle"></i> 错误: ' + escapeHtml(e.message) + '</div>';
    }
}

function getFileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const icons = { 'js': 'fa-js', 'ts': 'fa-js', 'py': 'fa-python', 'html': 'fa-html5', 'css': 'fa-css3', 'json': 'fa-code', 'md': 'fa-markdown', 'txt': 'fa-file-alt', 'yml': 'fa-file-code', 'yaml': 'fa-file-code', 'toml': 'fa-file-code', 'sh': 'fa-terminal', 'jpg': 'fa-image', 'png': 'fa-image', 'gif': 'fa-image', 'svg': 'fa-image', 'pdf': 'fa-file-pdf', 'zip': 'fa-file-archive', 'tar': 'fa-file-archive', 'gz': 'fa-file-archive' };
    return icons[ext] || 'fa-file';
}

function refreshFiles() {
    loadFiles(currentPath);
}

// 新建文件
function showNewFileModal() {
    showModal('新建文件', '<div class="form-group"><label>文件名</label><input type="text" id="newFileName" placeholder="如: test.js"></div><div class="form-group"><label>初始内容（可选）</label><textarea id="newFileContent" style="width:100%;height:120px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px;color:var(--text-primary);font-family:monospace;font-size:13px;resize:none;outline:none;" placeholder="// 文件内容..."></textarea></div>', async () => {
        const name = document.getElementById('newFileName').value.trim();
        const content = document.getElementById('newFileContent').value;
        if (!name) { showToast('请输入文件名', 'error'); return; }
        const filePath = currentPath === '/' ? '/' + name : currentPath + '/' + name;
        try {
            const resp = await fetch(API_HOST + '/api/files/write', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: filePath, content: content}) });
            const data = await resp.json();
            if (data.success) {
                showToast('文件已创建', 'success');
                closeModal();
                refreshFiles();
            } else {
                showToast('创建失败: ' + (data.error || '未知错误'), 'error');
            }
        } catch(e) { showToast('创建失败: ' + e.message, 'error'); }
    });
}

// 新建目录
function showNewDirModal() {
    showModal('新建目录', '<div class="form-group"><label>目录名</label><input type="text" id="newDirName" placeholder="如: my-folder"></div>', async () => {
        const name = document.getElementById('newDirName').value.trim();
        if (!name) { showToast('请输入目录名', 'error'); return; }
        const dirPath = currentPath === '/' ? '/' + name : currentPath + '/' + name;
        try {
            const resp = await fetch(API_HOST + '/api/files/mkdir', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: dirPath}) });
            const data = await resp.json();
            if (data.success) {
                showToast('目录已创建', 'success');
                closeModal();
                refreshFiles();
            } else {
                showToast('创建失败: ' + (data.error || '未知错误'), 'error');
            }
        } catch(e) { showToast('创建失败: ' + e.message, 'error'); }
    });
}

// 删除
async function deleteItem(path, type) {
    const dangerous = ['/etc','/usr','/bin','/sbin','/lib','/lib64','/boot','/dev','/proc','/sys','/var','/root','/home','/tmp','/opt','/mnt','/media','/srv','/run'];
    const isDangerous = dangerous.some(d => path === d || path.startsWith(d + '/'));
    if (isDangerous) {
        if (!confirm('⚠️ 警告：' + path + ' 是系统关键路径！\n\n删除可能导致系统崩溃！\n\n确定要删除吗？')) return;
    } else {
        if (!confirm('确定删除' + (type === 'dir' ? '目录' : '文件') + ': ' + path + '？')) return;
    }
    try {
        const resp = await fetch(API_HOST + '/api/files/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: path}) });
        const data = await resp.json();
        if (data.success) {
            showToast('已删除', 'success');
            refreshFiles();
        } else {
            showToast('删除失败: ' + (data.error || '未知错误'), 'error');
        }
    } catch(e) { showToast('删除失败: ' + e.message, 'error'); }
}

// 编辑文件
async function editFile(path) {
    const container = document.getElementById('fileList');
    container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>';
    try {
        const resp = await fetch(API_HOST + '/api/files?path=' + encodeURIComponent(path));
        const data = await resp.json();
        if (!data.success) {
            container.innerHTML = '<div style="color:var(--accent-6);text-align:center;padding:40px;">' + escapeHtml(data.error || '加载失败') + '</div>';
            return;
        }
        const content = data.content || '';
        container.innerHTML = `
            <div class="file-editor">
                <div class="file-editor-header">
                    <span class="path"><i class="fas fa-edit"></i> 编辑: ${escapeHtml(path)}</span>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-success btn-sm" onclick="saveEditedFile('${escapeHtml(path).replace(/'/g, "\\'")}')"><i class="fas fa-save"></i> 保存</button>
                        <button class="btn btn-ghost btn-sm" onclick="refreshFiles()"><i class="fas fa-times"></i> 取消</button>
                    </div>
                </div>
                <textarea id="fileEditArea">${escapeHtml(content)}</textarea>
            </div>`;
    } catch(e) {
        container.innerHTML = '<div style="color:var(--accent-6);text-align:center;padding:40px;">错误: ' + escapeHtml(e.message) + '</div>';
    }
}

async function saveEditedFile(path) {
    const textarea = document.getElementById('fileEditArea');
    if (!textarea) return;
    const newContent = textarea.value;
    try {
        const resp = await fetch(API_HOST + '/api/files/write', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: path, content: newContent}) });
        const data = await resp.json();
        if (data.success) {
            showToast('文件已保存', 'success');
            refreshFiles();
        } else {
            showToast('保存失败: ' + (data.error || '未知错误'), 'error');
        }
    } catch(e) { showToast('保存失败: ' + e.message, 'error'); }
}

// 下载文件
async function downloadFile(path) {
    try {
        const resp = await fetch(API_HOST + '/api/files?path=' + encodeURIComponent(path));
        const data = await resp.json();
        if (!data.success) { showToast(data.error || '下载失败', 'error'); return; }
        const blob = new Blob([data.content || ''], {type: 'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = path.split('/').pop();
        a.click();
        URL.revokeObjectURL(url);
    } catch(e) { showToast('下载失败: ' + e.message, 'error'); }
}

// 上传文件
async function handleUpload(files) {
    for (const file of files) {
        const filePath = currentPath === '/' ? '/' + file.name : currentPath + '/' + file.name;
        const formData = new FormData();
        formData.append('path', filePath);
        formData.append('file', file);
        try {
            const resp = await fetch(API_HOST + '/api/files/upload', { method: 'POST', body: formData });
            const data = await resp.json();
            if (data.success) {
                showToast('已上传: ' + file.name, 'success');
            } else {
                showToast('上传失败: ' + (data.error || '未知错误'), 'error');
            }
        } catch(err) { showToast('上传失败: ' + err.message, 'error'); }
    }
    setTimeout(refreshFiles, 500);
}

// Modal helpers
function showModal(title, bodyHtml, onConfirm) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'activeModal';
    modal.innerHTML = `
        <div class="modal-box">
            <h3><i class="fas fa-plus-circle"></i> ${escapeHtml(title)}</h3>
            ${bodyHtml}
            <div class="actions">
                <button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button>
                <button class="btn btn-success btn-sm" id="modalConfirmBtn">确定</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('modalConfirmBtn').onclick = onConfirm;
}

function closeModal() {
    const modal = document.getElementById('activeModal');
    if (modal) modal.remove();
}

// 初始化
navigateTo('/');
</script>
<script src="auth.js?v=20260429"></script>
<script src="navbar.js?v=20260429"></script>
</body>
</html>
