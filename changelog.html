<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>像素农场 · 小猪智能体面板</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20260429">
<link rel="stylesheet" href="navbar.css?v=20260429">
<style>
/* =========================================================
   像素农场 - 纯 CSS 横版像素场景
   ========================================================= */
.pixel-farm {
  position: relative;
  width: 100%;
  height: 520px;
  overflow: hidden;
  border-radius: 12px;
  border: 3px solid #2a1f14;
  image-rendering: pixelated;
  font-family: 'Press Start 2P', monospace;
}

/* ===== 天空 ===== */
.farm-sky {
  position: absolute; top: 0; left: 0; right: 0;
  height: 55%;
  transition: background 3s ease;
  z-index: 0;
}
.farm-sky.day {
  background: linear-gradient(180deg, #87CEEB 0%, #B0E0F6 40%, #E0F0FF 100%);
}
.farm-sky.night {
  background: linear-gradient(180deg, #0a0e27 0%, #162040 50%, #1a2545 100%);
}

/* 太阳/月亮 */
.farm-sun {
  position: absolute; top: 18px; right: 12%;
  width: 36px; height: 36px;
  background: #FFE44D;
  border-radius: 0;
  box-shadow: 0 0 20px rgba(255,228,77,0.6);
  transition: all 3s ease;
}
.farm-sun.night {
  background: #E8E8F0;
  box-shadow: 0 0 16px rgba(232,232,240,0.4);
}

/* 云朵 - 像素方块 */
.farm-cloud {
  position: absolute;
  background: #fff;
  opacity: 0.9;
  box-shadow:
    8px 0 0 #fff, 16px 0 0 #fff, 24px 0 0 #fff,
    0 -8px 0 #fff, 8px -8px 0 #fff, 16px -8px 0 #fff,
    4px 8px 0 #fff, 12px 8px 0 #fff, 20px 8px 0 #fff;
  animation: cloudFloat linear infinite;
}
@keyframes cloudFloat {
  from { transform: translateX(0); }
  to { transform: translateX(80px); }
}

/* 远山 */
.farm-mountains {
  position: absolute;
  bottom: 45%; left: 0; right: 0;
  height: 120px;
  z-index: 1;
}
.farm-mountain {
  position: absolute; bottom: 0;
  width: 0; height: 0;
  border-style: solid;
}
.farm-mountain.m1 {
  left: -20px;
  border-width: 0 80px 100px 80px;
  border-color: transparent transparent #6B8E6B transparent;
}
.farm-mountain.m2 {
  left: 120px;
  border-width: 0 100px 130px 100px;
  border-color: transparent transparent #5A7D5A transparent;
}
.farm-mountain.m3 {
  left: 350px;
  border-width: 0 90px 110px 90px;
  border-color: transparent transparent #6B8E6B transparent;
}
.farm-mountain.m4 {
  right: 40px;
  border-width: 0 70px 90px 70px;
  border-color: transparent transparent #5A7D5A transparent;
}

/* ===== 地面 ===== */
.farm-ground {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 45%;
  z-index: 2;
}
.farm-grass {
  position: absolute; top: 0; left: 0; right: 0;
  height: 14px;
  background: #4CAF50;
  border-top: 3px solid #66BB6A;
  box-shadow: 0 2px 0 #388E3C;
}
.farm-dirt {
  position: absolute; top: 14px; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, #8B6914 0%, #7A5C12 20%, #6B4F10 60%, #5C420E 100%);
}
/* 草地装饰 */
.farm-grass::before {
  content: '';
  position: absolute; top: -6px; left: 0; right: 0; height: 6px;
  background:
    repeating-linear-gradient(90deg,
      transparent 0px, transparent 6px,
      #66BB6A 6px, #66BB6A 8px,
      transparent 8px, transparent 14px,
      #4CAF50 14px, #4CAF50 16px,
      transparent 16px, transparent 22px
    );
}

/* ===== 栅栏 ===== */
.farm-fence {
  position: absolute;
  bottom: 18%; z-index: 3;
  display: flex; align-items: flex-end;
}
.fence-post {
  width: 8px; height: 32px;
  background: linear-gradient(90deg, #A0522D 30%, #8B4513 70%);
  margin: 0 10px;
  border: 1px solid #6B3A0E;
  position: relative;
}
.fence-post::before {
  content: '';
  position: absolute; top: 4px; left: -12px;
  width: 32px; height: 5px;
  background: #A0522D;
  border: 1px solid #6B3A0E;
}
.fence-post::after {
  content: '';
  position: absolute; top: 18px; left: -12px;
  width: 32px; height: 5px;
  background: #A0522D;
  border: 1px solid #6B3A0E;
}

/* ===== 工位（电脑桌） ===== */
.farm-desk {
  position: absolute;
  bottom: 14%; z-index: 5;
}
.desk-body {
  width: 60px; height: 36px;
  background: linear-gradient(180deg, #8B6914, #7A5C12);
  border: 2px solid #5C420E;
  position: relative;
}
.desk-body::before { /* drawer */
  content: '';
  position: absolute; top: 4px; left: 4px;
  width: 52px; height: 14px;
  background: #6B4F10;
  border: 1px solid #5C420E;
}
.desk-body::after { /* drawer knob */
  content: '';
  position: absolute; top: 9px; left: 26px;
  width: 8px; height: 4px;
  background: #C8A04A;
  border-radius: 2px;
}
.desk-monitor {
  position: absolute; bottom: 36px; left: 10px;
  width: 40px; height: 30px;
  background: #2C2C3A;
  border: 2px solid #3C3C4A;
  border-radius: 2px;
}
.desk-monitor::before { /* screen */
  content: '';
  position: absolute; top: 3px; left: 3px; right: 3px; bottom: 6px;
  background: linear-gradient(135deg, #1a3a5c, #1a2a4c);
  border: 1px solid #1a4a6c;
}
.desk-monitor::after { /* stand */
  content: '';
  position: absolute; bottom: -6px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 6px;
  background: #3C3C4A;
}
.desk-keyboard {
  position: absolute; bottom: 38px; left: 14px;
  width: 32px; height: 8px;
  background: #3C3C4A;
  border: 1px solid #4C4C5A;
}
.desk-chair {
  position: absolute;
  bottom: 0; right: -18px;
}
.chair-seat {
  width: 20px; height: 8px;
  background: #4f46e5;
  border: 2px solid #3730a3;
}
.chair-back {
  position: absolute; bottom: 8px; left: 2px;
  width: 16px; height: 18px;
  background: #4f46e5;
  border: 2px solid #3730a3;
  border-bottom: none;
}

/* ===== 装饰：树 ===== */
.farm-tree {
  position: absolute;
  bottom: 14%; z-index: 4;
}
.tree-trunk {
  width: 12px; height: 28px;
  background: linear-gradient(90deg, #6B3A0E, #8B5A2C, #6B3A0E);
  margin: 0 auto;
}
.tree-leaves {
  width: 32px; height: 24px;
  background: #2E7D32;
  border: 2px solid #1B5E20;
  margin: 0 auto;
  position: relative;
}
.tree-leaves::before {
  content: '';
  position: absolute; top: -10px; left: 4px;
  width: 24px; height: 14px;
  background: #388E3C;
  border: 2px solid #2E7D32;
}
.tree-leaves::after {
  content: '';
  position: absolute; top: -18px; left: 8px;
  width: 16px; height: 10px;
  background: #43A047;
  border: 2px solid #388E3C;
}

/* ===== 装饰：花朵 ===== */
.farm-flower {
  position: absolute;
  bottom: 13%; z-index: 4;
}
.flower-stem {
  width: 3px; height: 12px;
  background: #388E3C;
  margin: 0 auto;
}
.flower-head {
  width: 10px; height: 10px;
  border-radius: 50%;
  margin: 0 auto;
}

/* ===== 像素角色 ===== */
.farm-character {
  position: absolute;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  /* transition for smooth position changes */
  transition: left 0.8s ease, bottom 0.8s ease;
}

/* 角色精灵容器 */
.char-sprite {
  width: 40px;
  height: 48px;
  position: relative;
  image-rendering: pixelated;
}

/* 角色阴影 */
.char-shadow {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 6px;
  background: rgba(0,0,0,0.25);
  border-radius: 50%;
}

/* 名称标签 */
.char-name-tag {
  margin-top: 2px;
  padding: 2px 6px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  font-size: 8px;
  font-family: 'Press Start 2P', monospace;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.2);
  text-align: center;
}

/* ===== 角色像素精灵（SVG） ===== */
/* 由 JS 注入 */

/* ===== 角色行为动画 ===== */

/* 工作状态：原地打字抖动 */
.farm-character.working {
  animation: charWork 0.5s ease-in-out infinite;
}
@keyframes charWork {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-1px) rotate(-1deg); }
  75% { transform: translateY(-1px) rotate(1deg); }
}

/* 工作状态：键盘闪烁 */
.farm-character.working .desk-keyboard {
  animation: keyTap 0.25s ease-in-out infinite;
}
@keyframes keyTap {
  0%, 100% { background: #3C3C4A; }
  50% { background: #5C5C6A; }
}
.farm-character.working .desk-monitor::before {
  animation: screenGlow 0.8s ease-in-out infinite;
}
@keyframes screenGlow {
  0%, 100% { background: linear-gradient(135deg, #1a3a5c, #1a2a4c); }
  50% { background: linear-gradient(135deg, #2a5a8c, #2a4a7c); }
}

/* 空闲状态：闲逛 */
.farm-character.idle {
  animation: charIdle 6s ease-in-out infinite;
}
@keyframes charIdle {
  0%   { transform: translateX(0); }
  20%  { transform: translateX(25px); }
  40%  { transform: translateX(40px) translateY(-3px); }
  60%  { transform: translateX(20px); }
  80%  { transform: translateX(-10px) translateY(-2px); }
  100% { transform: translateX(0); }
}

/* 空闲状态：身体轻微摇摆 */
.farm-character.idle .char-sprite {
  animation: charSway 2s ease-in-out infinite;
}
@keyframes charSway {
  0%, 100% { transform: rotate(0); }
  30% { transform: rotate(-2deg); }
  70% { transform: rotate(2deg); }
}

/* 离线状态：灰暗 */
.farm-character.offline .char-sprite {
  filter: grayscale(0.8) brightness(0.5);
}
.farm-character.offline .desk-monitor::before {
  background: #1a1a2a;
}

/* ===== 状态图例 ===== */
.farm-legend {
  display: flex;
  gap: 20px;
  padding: 10px 16px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 0;
  border: 1px solid rgba(255,255,255,0.2);
}
.legend-dot.working { background: #10b981; }
.legend-dot.idle { background: #f59e0b; }
.legend-dot.offline { background: #ef4444; }

/* ===== HUD 状态栏 ===== */
.farm-hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
.farm-hud-left, .farm-hud-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hud-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-secondary);
}
.hud-item .hud-val { font-weight: 700; color: var(--text-primary); }
.hud-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.08); }

/* ===== 详情面板 ===== */
.farm-detail {
  display: none;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 16px;
  margin-top: 12px;
  animation: detailIn 0.3s ease;
}
.farm-detail.active { display: block; }
@keyframes detailIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.farm-detail h3 {
  font-size: 13px; font-weight: 700;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.farm-detail h3 i { color: var(--accent-1); }
.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}
.detail-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 6px;
  padding: 10px;
}
.detail-card .d-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
.detail-card .d-val { font-size: 16px; font-weight: 800; }
.mi { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; font-size: 10px; }
.mi.g { background: rgba(16,185,129,0.15); color: #10b981; }
.mi.b { background: rgba(99,102,241,0.15); color: #6366f1; }
.mi.c { background: rgba(6,182,212,0.15); color: #06b6d4; }
.mi.y { background: rgba(245,158,11,0.15); color: #f59e0b; }
.mi.r { background: rgba(239,68,68,0.15); color: #ef4444; }

/* ===== 昼夜切换按钮 ===== */
.farm-toggle {
  position: absolute; top: 10px; right: 10px; z-index: 50;
  padding: 6px 12px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: #fff;
  font-size: 11px;
  cursor: pointer;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
}
.farm-toggle:hover { background: rgba(0,0,0,0.7); }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .pixel-farm { height: 400px; }
  .farm-hud { flex-direction: column; align-items: flex-start; }
}

/* ===== 星星（夜晚） ===== */
.farm-star {
  position: absolute;
  width: 3px; height: 3px;
  background: #fff;
  opacity: 0;
  transition: opacity 3s ease;
}
.farm-star.visible {
  opacity: 0.8;
  animation: starTwinkle 2s ease-in-out infinite;
}
@keyframes starTwinkle {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.9; }
}
</style>
</head>
<body>
<div id="navbar-container"></div>
<div class="main-container">

  <!-- HUD -->
  <div class="farm-hud">
    <div class="farm-hud-left">
      <div class="hud-item"><i class="fas fa-microchip" style="color:#6366f1"></i> Agents: <span class="hud-val" id="hud-agents">0</span></div>
      <div class="hud-sep"></div>
      <div class="hud-item"><i class="fas fa-bolt" style="color:#10b981"></i> 工作中: <span class="hud-val" id="hud-working">0</span></div>
      <div class="hud-sep"></div>
      <div class="hud-item"><i class="fas fa-coffee" style="color:#f59e0b"></i> 摸鱼: <span class="hud-val" id="hud-idle">0</span></div>
    </div>
    <div class="farm-hud-right">
      <div class="hud-item"><i class="fas fa-tachometer-alt" style="color:#a78bfa"></i> CPU: <span class="hud-val" id="hud-cpu">--</span></div>
      <div class="hud-sep"></div>
      <div class="hud-item"><i class="fas fa-memory" style="color:#06b6d4"></i> MEM: <span class="hud-val" id="hud-mem">--</span></div>
      <div class="hud-sep"></div>
      <div class="hud-item"><i class="fas fa-clock" style="color:var(--text-muted)"></i> <span id="hud-uptime">--</span></div>
    </div>
  </div>

  <!-- 像素农场场景 -->
  <div class="pixel-farm" id="farmScene">
    <!-- 天空 -->
    <div class="farm-sky day" id="farmSky">
      <div class="farm-sun" id="farmSun"></div>
      <!-- 星星（夜晚显示） -->

      <div class="farm-star" style="top:8%;left:25%"></div>
      <div class="farm-star" style="top:18%;left:40%"></div>
      <div class="farm-star" style="top:5%;left:55%"></div>
      <div class="farm-star" style="top:15%;left:70%"></div>
      <div class="farm-star" style="top:10%;left:85%"></div>
      <div class="farm-star" style="top:22%;left:15%"></div>
      <div class="farm-star" style="top:7%;left:62%"></div>
    </div>

    <!-- 云朵 -->
    <div class="farm-cloud" style="top:30px;left:10%;width:24px;height:16px;animation-duration:20s"></div>
    <div class="farm-cloud" style="top:50px;left:55%;width:20px;height:14px;animation-duration:25s;animation-delay:-8s"></div>
    <div class="farm-cloud" style="top:20px;left:75%;width:16px;height:12px;animation-duration:18s;animation-delay:-15s"></div>

    <!-- 远山 -->
    <div class="farm-mountains">
      <div class="farm-mountain m1"></div>
      <div class="farm-mountain m2"></div>
      <div class="farm-mountain m3"></div>
      <div class="farm-mountain m4"></div>

    <!-- 地面 -->
    <div class="farm-ground">
      <div class="farm-grass"></div>
      <div class="farm-dirt"></div>

    <!-- 栅栏（左） -->
    <div class="farm-fence" style="left:20px;">

  <!-- 详情面板 -->

  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;color:var(--text-muted);font-size:11px;">
    <span><i class="fas fa-gamepad"></i> 像素农场 v3.0 - Pixel Farm</span>
    <span id="lastUpdate">--</span>
  </div>
</div>

<script>
var API_HOST = window.location.origin;

// ===== 像素角色精灵 =====
function makeSprite(id, status) {
  var c = id === 'codex'
    ? {s:'#06b6d4',p:'#0e7490',sk:'#fcd5b8',h:'#1a1a2e',sh:'#0c4a6e'}
    : {s:'#6366f1',p:'#3730a3',sk:'#fcd5b8',h:'#5d4037',sh:'#1e1b4b'};

  if (status === 'online') {
    // 工作：坐姿，手放键盘上
    return '<svg width="40" height="48" viewBox="0 0 40 48">' +
      // 腿
      '<rect x="10" y="34" width="8" height="10" fill="'+c.p+'" rx="1"/>' +

// ===== 工位 =====
function makeDesk(x) {
  var el = document.createElement('div');
  el.className = 'farm-desk';
  el.style.left = x + 'px';
  el.innerHTML =
    '<div class="desk-chair"><div class="chair-back"></div><div class="chair-seat"></div></div>' +
    '<div class="desk-body"></div>' +
    '<div class="desk-monitor"></div>' +
    '<div class="desk-keyboard"></div>';
  return el;
}

// ===== 角色 =====
function makeCharacter(id, info, status, x, y) {
  var el = document.createElement('div');
  el.className = 'farm-character ' + status;
  el.style.left = x + 'px';
  el.style.bottom = y + 'px';
  el.dataset.agentId = id;

  var label = info.name || id;
  el.innerHTML =
    '<div class="char-sprite"><div class="char-shadow"></div>' + makeSprite(id, status) + '</div>' +
    '<div class="char-name-tag">' + label + '</div>';

  el.addEventListener('click', function() { showDetail(id, info, status); });
  return el;
}

// ===== 渲染 =====
var deskPositions = [];
var charPositions = {};

function renderFarm(agents) {
  var scene = document.getElementById('farmScene');
  // 清理旧工位和角色
  scene.querySelectorAll('.farm-desk, .farm-character').forEach(function(el){ el.remove(); });

  var ids = Object.keys(agents);
  var n = ids.length;
  if (n === 0) return;

  var W = scene.clientWidth || 800;
  var charBottom = 14; // % from bottom

  // 工位放在右下区域，均匀分布
  var deskW = 64;
  var gap = 40;
  var totalW = n * deskW + (n - 1) * gap;
  var deskStartX = Math.max(20, W * 0.55);
  var deskY = 52; // px from bottom

  deskPositions = [];

  for (var i = 0; i < n; i++) {
    var aid = ids[i];
    var info = agents[aid];
    var status = info.status || 'offline';

    var dx = deskStartX + i * (deskW + gap);
    scene.appendChild(makeDesk(dx));
    deskPositions.push({ id: aid, x: dx, y: deskY });

    // 角色位置
    var cx, cy;
    if (status === 'online') {
      // 站在工位前
      cx = dx + deskW / 2 - 20;
      cy = deskY + 30;
    } else {
      // 在农场上半部分自由活动
      var hash = 0;
      for (var ch = 0; ch < aid.length; ch++) hash += aid.charCodeAt(ch);
      cx = 40 + (hash * 37) % (W - 120);
      cy = 80 + (hash * 13) % 100;
    }

    charPositions[aid] = { x: cx, y: cy };
    scene.appendChild(makeCharacter(aid, info, status, cx, cy));
  }
}

// ===== 详情 =====
function showDetail(id, info, status) {
  var panel = document.getElementById('farmDetail');
  var title = document.getElementById('detailTitle');
  var grid = document.getElementById('detailGrid');

  var si = status === 'online' ? '[WORK]' : status === 'offline' ? '[OFF]' : '[IDLE]';
  title.textContent = si + ' ' + (info.name || id);

  var sc = status === 'online' ? 'g' : status === 'offline' ? 'r' : 'y';
  var st = status === 'online' ? '#10b981' : status === 'offline' ? '#ef4444' : '#f59e0b';
  var cpu = info.cpu_usage != null ? info.cpu_usage.toFixed(1) + '%' : '--';
  var mem = info.memory_usage != null ? info.memory_usage.toFixed(1) + '%' : '--';
  var mmb = info.mem_mb != null ? info.mem_mb + 'MB' : '--';
  var ni = fmtB(info.network_in || 0);
  var no = fmtB(info.network_out || 0);
  var mdl = info.model || '--';
  var ac = info.api_calls || 0;
  var stText = status === 'online' ? '疯狂敲代码' : status === 'offline' ? '离线休眠' : '摸鱼中';

  grid.innerHTML =
    '<div class="detail-card"><div class="d-label"><span class="mi '+sc+'"><i class="fas fa-circle"></i></span> 状态</div><div class="d-val" style="color:'+st+'">'+stText+'</div></div>' +
    '<div class="detail-card"><div class="d-label"><span class="mi b"><i class="fas fa-microchip"></i></span> CPU</div><div class="d-val">'+cpu+'</div></div>' +
    '<div class="detail-card"><div class="d-label"><span class="mi c"><i class="fas fa-memory"></i></span> 内存</div><div class="d-val">'+mem+'</div></div>' +
    '<div class="detail-card"><div class="d-label"><span class="mi y"><i class="fas fa-hdd"></i></span> 内存(MB)</div><div class="d-val">'+mmb+'</div></div>' +
    '<div class="detail-card"><div class="d-label"><span class="mi g"><i class="fas fa-network-wired"></i></span> 网络入</div><div class="d-val">'+ni+'</div></div>' +
    '<div class="detail-card"><div class="d-label"><span class="mi b"><i class="fas fa-network-wired"></i></span> 网络出</div><div class="d-val">'+no+'</div></div>' +
    '<div class="detail-card"><div class="d-label"><span class="mi c"><i class="fas fa-brain"></i></span> 模型</div><div class="d-val" style="font-size:12px">'+mdl+'</div></div>' +
    '<div class="detail-card"><div class="d-label"><span class="mi y"><i class="fas fa-phone-volume"></i></span> API调用</div><div class="d-val">'+ac+'</div></div>';

  panel.classList.add('active');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function fmtB(b) {
  if (b < 1024) return b + 'B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + 'KB';
  if (b < 1024*1024*1024) return (b/(1024*1024)).toFixed(1) + 'MB';
  return (b/(1024*1024*1024)).toFixed(1) + 'GB';
}

function fmtU(s) {
  var d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

// ===== HUD =====
function updateHUD(data) {
  var agents = data.agents || {};
  var sys = data.system_info || {};
  var ids = Object.keys(agents);
  var working = 0;
  for (var i = 0; i < ids.length; i++) if (agents[ids[i]].status === 'online') working++;
  document.getElementById('hud-agents').textContent = ids.length;
  document.getElementById('hud-working').textContent = working;
  document.getElementById('hud-idle').textContent = ids.length - working;
  document.getElementById('hud-cpu').textContent = sys.total_cpu != null ? sys.total_cpu.toFixed(1) + '%' : '--';
  document.getElementById('hud-mem').textContent = sys.total_memory != null ? sys.total_memory.toFixed(1) + '%' : '--';
  document.getElementById('hud-uptime').textContent = fmtU(sys.server_uptime_seconds || 0);
  document.getElementById('lastUpdate').textContent = 'Update: ' + new Date().toLocaleTimeString('zh-CN');
}

// ===== 数据获取 =====
function fetchData() {
  fetch(API_HOST + '/api/status')
    .then(function(r) { return r.json(); })
    .then(function(d) { renderFarm(d.agents || {}); updateHUD(d); })
    .catch(function(){});
}

function connectSSE() {
  var es = new EventSource(API_HOST + '/api/events');
  es.onopen = function(){ console.log('Pixel Farm SSE OK'); };
  es.onmessage = function(e) {
    try { var msg = JSON.parse(e.data); if (msg.data) { renderFarm(msg.data.agents || {}); updateHUD(msg.data); } } catch(err){}
  };
  es.onerror = function(){ es.close(); setTimeout(connectSSE, 3000); };
}

// ===== 昼夜切换 =====
var isDay = true;
document.getElementById('dayNightToggle').addEventListener('click', function() {
  isDay = !isDay;
  var sky = document.getElementById('farmSky');
  var sun = document.getElementById('farmSun');
  var stars = document.querySelectorAll('.farm-star');
  if (isDay) {
    sky.classList.remove('night');
    sky.classList.add('day');
    sun.classList.remove('night');
    stars.forEach(function(s){ s.classList.remove('visible'); });
    this.innerHTML = '<i class="fas fa-moon"></i> 昼夜';
  } else {
    sky.classList.remove('day');
    sky.classList.add('night');
    sun.classList.add('night');
    stars.forEach(function(s){ s.classList.add('visible'); });
    this.innerHTML = '<i class="fas fa-sun"></i> 昼夜';
  }
});

// ===== 点击空白关闭面板 =====
document.getElementById('farmScene').addEventListener('click', function(e) {
  if (e.target === this || e.target.classList.contains('farm-ground') || e.target.classList.contains('farm-grass') || e.target.classList.contains('farm-dirt') || e.target.classList.contains('farm-sky') || e.target.classList.contains('farm-mountains')) {
    document.getElementById('farmDetail').classList.remove('active');
  }
});

// ===== 初始化 =====
fetchData();
connectSSE();
</script>
